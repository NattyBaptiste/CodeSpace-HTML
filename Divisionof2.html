<!DOCTYPE html>
<html>
<head>
    <title>Divide Two Numbers</title>
</head>
<body>

    <h2>Division of Two Numbers</h2>

    <script>
        // Program to divide two numbers entered by the user

        // Ask the user to input the first number
        let num1 = prompt("Input the first number:");

        // Ask the user to input the second number
        let num2 = prompt("Input the second number:");

        // Convert input strings to numbers
        num1 = Number(num1);
        num2 = Number(num2);

        // Perform division
        let result = num1 / num2;

        // Display the result on the web page
        document.write("Input the first number: " + num1 + "<br>");
        document.write("Input the second number: " + num2 + "<br>");
        document.write("The division of the first number and the second number is: " + result);
    </script>

</body>
</html>
