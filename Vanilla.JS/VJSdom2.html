<!DOCTYPE html>
<html>
<head>
    <title>Volume of Sphere</title>

    <script>
        // Function to calculate the volume of a sphere
        function calculateVolume() {

            // Get radius value from input field and convert it to a number
            var radius = Number(document.getElementById("radius").value);

            // Check if radius is valid (non-negative)
            if (radius < 0) {
                document.getElementById("result").innerHTML =
                    "Radius cannot be negative.";
                return;
            }

            // Formula: Volume = (4/3) * π * r^3
            var volume = (4 / 3) * Math.PI * Math.pow(radius, 3);

            // Display result rounded to 2 decimal places
            document.getElementById("result").innerHTML =
                "Volume of the sphere is: " + volume.toFixed(2);
        }
    </script>
</head>

<body>

    <h2>Volume of a Sphere Calculator</h2>

    <!-- Input field for radius -->
    Enter radius of sphere:
    <input type="number" id="radius" step="any"><br><br>

    <!-- Button to trigger calculation -->
    <button onclick="calculateVolume()">Calculate Volume</button>

    <h3>Result:</h3>

    <!-- Output displayed here -->
    <p id="result"></p>

</body>
</html>
