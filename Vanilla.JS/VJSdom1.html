<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Activity 1 - Vanilla JS DOM</title>

    <script>
        // Function to change the style of the paragraph text
        function js_style() {

            // Get the paragraph element by its id
            var textElement = document.getElementById("text");

            // Change font size
            textElement.style.fontSize = "24px";

            // Change font color
            textElement.style.color = "blue";

            // Change font weight to bold
            textElement.style.fontWeight = "bold";

            // Change font family
            textElement.style.fontFamily = "Arial";

            // Optional: change background color
            textElement.style.backgroundColor = "lightyellow";
        }
    </script>
</head>

<body>

    <!-- Paragraph whose style will be modified -->
    <p id="text">Vanilla JS DOM</p>

    <div>
        <!-- Button triggers JavaScript function -->
        <button id="jsstyle" onclick="js_style()">Style</button>
    </div>

</body>
</html>
