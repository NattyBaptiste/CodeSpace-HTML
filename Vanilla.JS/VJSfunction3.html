<!DOCTYPE html>
<html>
<head>
    <title>Prime Number Checker</title>

    <script>
        // Function to check whether a number is prime or not
        function isPrime(n) {

            // Negative numbers, 0 and 1 are not prime
            if (n <= 1) {
                return false;
            }

            // Loop from 2 to square root of n for efficiency
            for (var i = 2; i <= Math.sqrt(n); i++) {

                // If divisible by any number other than 1 and itself
                if (n % i === 0) {
                    return false;
                }
            }

            // If no divisors found, number is prime
            return true;
        }

        // Function to take input and display result
        function checkPrime() {

            // Get number from input field and convert to Number type
            var num = Number(document.getElementById("number").value);

            // Call isPrime function
            var result = isPrime(num);

            // Display result on webpage
            if (result) {
                document.getElementById("result").innerHTML =
                    num + " is a Prime Number.";
            } else {
                document.getElementById("result").innerHTML =
                    num + " is NOT a Prime Number.";
            }

            // Also print result in console
            console.log(num + (result ? " is Prime" : " is Not Prime"));
        }
    </script>
</head>

<body>

    <h2>Prime Number Checker</h2>

    <!-- Input field for number -->
    Enter a number:
    <input type="number" id="number"><br><br>

    <!-- Button to trigger prime check -->
    <button onclick="checkPrime()">Check Prime</button>

    <h3>Result:</h3>

    <!-- Output displayed here -->
    <p id="result"></p>

</body>
</html>
