<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd Checker</title>

    <script>
        // Function to check even or odd numbers from 0 to 15
        function checkEvenOdd() {

            // Get the output container element
            var output = document.getElementById("result");

            // Clear previous output
            output.innerHTML = "";

            // Loop from 0 to 15
            for (var i = 0; i <= 15; i++) {

                // Check if number is even or odd
                if (i % 2 === 0) {
                    output.innerHTML += i + " is even<br>";
                    console.log(i + " is even");
                } else {
                    output.innerHTML += i + " is odd<br>";
                    console.log(i + " is odd");
                }
            }
        }
    </script>
</head>

<body>

    <h2>Even or Odd Numbers (0 to 15)</h2>

    <!-- Button to start the loop -->
    <button onclick="checkEvenOdd()">Show Result</button>

    <h3>Output:</h3>
    <!-- Results will be displayed here -->
    <p id="result"></p>

</body>
</html>
