<!DOCTYPE html>
<html>
<head>
    <title>Find Min and Max in Array</title>

    <script>
        // Function to find minimum and maximum values in an array
        function findMinMax() {

            // Sample array given in the question
            var numbers = [25, 14, 56, 15, 36, 56, 77, 18, 29, 49];

            // Initialize min and max with the first element of the array
            var min = numbers[0];
            var max = numbers[0];

            // Loop through the array to find min and max values
            for (var i = 1; i < numbers.length; i++) {

                // If current element is smaller than min, update min
                if (numbers[i] < min) {
                    min = numbers[i];
                }

                // If current element is greater than max, update max
                if (numbers[i] > max) {
                    max = numbers[i];
                }
            }

            // Display results on the webpage
            document.getElementById("result").innerHTML =
                "Minimum value: " + min + "<br>" +
                "Maximum value: " + max;

            // Also print results in console (optional)
            console.log("Minimum value: " + min);
            console.log("Maximum value: " + max);
        }
    </script>
</head>

<body>

    <h2>Find Minimum and Maximum Values in Array</h2>

    <!-- Button to trigger function -->
    <button onclick="findMinMax()">Find Min & Max</button>

    <h3>Result:</h3>

    <!-- Output displayed here -->
    <p id="result"></p>

</body>
</html>
