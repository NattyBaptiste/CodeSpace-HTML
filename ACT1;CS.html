<!DOCTYPE html>
<html>
<head>
    <title>Compare Three Numbers</title>

    <script>
        // Function to compare three numbers
        function compareNumbers() {

            // Get values from input fields and convert them to numbers
            var num1 = Number(document.getElementById("num1").value);
            var num2 = Number(document.getElementById("num2").value);
            var num3 = Number(document.getElementById("num3").value);

            // Check if all numbers are equal
            if (num1 === num2 && num2 === num3) {
                document.getElementById("result").innerHTML = "All numbers are equal";
            }

            // Check if all numbers are different
            else if (num1 !== num2 && num2 !== num3 && num1 !== num3) {
                document.getElementById("result").innerHTML = "All numbers are different";
            }

            // Otherwise, neither all equal nor all different
            else {
                document.getElementById("result").innerHTML = "Neither all are equal or different";
            }
        }
    </script>
</head>

<body>

    <h2>Enter Three Numbers</h2>

    <!-- Input fields for numbers -->
    Input first number:
    <input type="number" id="num1"><br><br>

    Input second number:
    <input type="number" id="num2"><br><br>

    Input third number:
    <input type="number" id="num3"><br><br>

    <!-- Button to trigger comparison -->
    <button onclick="compareNumbers()">Check</button>

    <h3>Result:</h3>
    <!-- Output will be shown here -->
    <p id="result"></p>

</body>
</html>
