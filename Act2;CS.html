<!DOCTYPE html>
<html>
<head>
    <title>Check Order of Numbers</title>

    <script>
        // Function to check whether numbers are increasing, decreasing, or neither
        function checkOrder() {

            // Get values from input fields and convert them to numbers
            var num1 = Number(document.getElementById("num1").value);
            var num2 = Number(document.getElementById("num2").value);
            var num3 = Number(document.getElementById("num3").value);

            // Check for increasing order (strictly increasing)
            if (num1 < num2 && num2 < num3) {
                document.getElementById("result").innerHTML = "Increasing order.";
            }

            // Check for decreasing order (strictly decreasing)
            else if (num1 > num2 && num2 > num3) {
                document.getElementById("result").innerHTML = "Decreasing order.";
            }

            // If neither increasing nor decreasing
            else {
                document.getElementById("result").innerHTML = "Neither increasing or decreasing order.";
            }
        }
    </script>
</head>

<body>

    <h2>Check Increasing or Decreasing Order</h2>

    <!-- Input fields -->
    Input first number:
    <input type="number" id="num1"><br><br>

    Input second number:
    <input type="number" id="num2"><br><br>

    Input third number:
    <input type="number" id="num3"><br><br>

    <!-- Button to trigger function -->
    <button onclick="checkOrder()">Check Order</button>

    <h3>Result:</h3>
    <!-- Output displayed here -->
    <p id="result"></p>

</body>
</html>
