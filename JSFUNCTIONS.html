<!DOCTYPE html>
<html>
<head>
    <title>Array Functions</title>

    <script>
        // Sample array given in the question
        var numbers = [10, 2, 3, 4, 7];

        // Function to display the array content
        function showArray() {

            // Display the array as a string
            document.getElementById("result").innerHTML =
                "The content of the array is: [" + numbers + "]";
        }

        // Function to find the maximum value in the array
        function findMax() {

            // Assume first element is the maximum
            var max = numbers[0];

            // Loop through the array to find the maximum value
            for (var i = 1; i < numbers.length; i++) {

                // If current element is greater than max, update max
                if (numbers[i] > max) {
                    max = numbers[i];
                }
            }

            // Display the maximum value
            document.getElementById("result").innerHTML =
                "The max value in the array is: " + max;
        }
    </script>
</head>

<body>

    <h2>Array Functions Example</h2>

    <!-- Button to show array -->
    <button onclick="showArray()">Show Array</button>

    <!-- Button to find max value -->
    <button onclick="findMax()">Find Max Value</button>

    <h3>Result:</h3>

    <!-- Output displayed here -->
    <p id="result"></p>

</body>
</html>
