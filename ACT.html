<!DOCTYPE html>
<html>
<head>
    <title>Activity 1 - Vanilla JS Basics</title>
</head>
<body>

    <h2>Results of Arithmetic Operations</h2>

    <script>
        // Activity 1 - Vanilla JS Basics
        // This program prints results directly on the web page

        // a. -5 + 8 * 6
        // Multiplication is done before addition
        document.write("a. " + (-5 + 8 * 6) + "<br>");

        // b. (55 + 9) % 9
        document.write("b. " + ((55 + 9) % 9) + "<br>");

        // c. 20 + -3 * 5 / 8
        document.write("c. " + (20 + (-3 * 5) / 8) + "<br>");

        // d. 5 + 15 / 3 * 2 - 8 % 3
        document.write("d. " + (5 + (15 / 3) * 2 - (8 % 3)).toFixed(1));
    </script>

</body>
</html>
